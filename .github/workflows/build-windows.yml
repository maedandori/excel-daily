name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - '.github/workflows/build-windows.yml'

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build release with embedded icon
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Bundle exe, settings, example
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/excel-daily.exe dist/
          Copy-Item settings.json dist/
          Copy-Item events.example.json dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath excel-daily-windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: excel-daily-windows
          path: excel-daily-windows.zip
