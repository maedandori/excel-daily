name: Build Windows EXE
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'settings-tauri/**'
      - 'ribbon/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'settings.json'
      - 'README.md'
      - '.github/workflows/build-windows.yml'

concurrency:
  group: excel-daily-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Validate Rust
        run: cargo check --target x86_64-pc-windows-msvc
      - name: Validate PowerShell syntax and duplicate functions (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @(Get-ChildItem scripts,tests -Recurse -File -Filter '*.ps1')) {
            $tokens=$null; $errors=$null
            $ast=[System.Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$errors)
            foreach($parseError in $errors){
              Write-Host "$($file.Name):$($parseError.Extent.StartLineNumber):$($parseError.Extent.StartColumnNumber): $($parseError.Message)"
            }
            if($errors.Count){throw "PowerShell syntax failed: $($file.FullName)"}
            if($file.Name -eq 'update_excel.ps1'){
              $duplicates=@($ast.FindAll({param($node) $node -is [System.Management.Automation.Language.FunctionDefinitionAst]},$true) | Group-Object Name | Where-Object Count -gt 1)
              if($duplicates.Count){throw "Duplicate production functions: $($duplicates.Name -join ', ')"}
            }
          }
      - name: Test Ribbon installer diagnostics (no Office required)
        shell: powershell
        run: |
          $result = powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/install-ribbon.ps1 -Diagnose
          if ($LASTEXITCODE -ne 0 -or (($result -join "`n") -notmatch 'RIBBON_DIAGNOSTICS_OK')) { throw 'Ribbon diagnostic command failed' }
      - name: Test no modal messages and busy/StatusBar lifecycle
        shell: powershell
        run: .\tests\status-feedback.test.ps1
      - name: Test active worksheet only and shift auto detection
        shell: powershell
        run: .\tests\active-sheet.test.ps1
      - name: Test exact clicked workbook targeting
        shell: powershell
        run: .\tests\target-workbook.test.ps1
      - name: Test Japanese user-facing messages and automatic update deferral
        shell: powershell
        run: |
          .\tests\japanese-messages.test.ps1
          .\tests\update-safety.test.ps1
      - name: Test 10 minute rounding in Windows PowerShell
        shell: powershell
        run: .\\tests\\round-time.test.ps1
      - name: Test drying safety and duration configuration
        shell: powershell
        run: .\tests\drying.test.ps1
      - name: Test mold color badge contract
        shell: powershell
        run: .\tests\mold-color-badge.test.ps1
      - name: Test Japanese color palette
        shell: powershell
        run: .\tests\color-cells.test.ps1
      - name: Test next-day and night shift selection
        shell: powershell
        run: .\\tests\\shift-date.test.ps1
      - name: Test Settings GUI construction without opening window
        shell: powershell
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File scripts/settings_gui.ps1 -SelfTest -ConfigPath settings.json
      - name: Test stale updater status is ignored
        shell: powershell
        run: .\\tests\\settings-update-state.test.ps1
      - name: Test Rust hotkey validation
        run: cargo test --target x86_64-pc-windows-msvc
      - name: Build release with embedded icon
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Test Tauri Settings configuration and build
        shell: pwsh
        run: |
          $rootVersion=(Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $settingsVersion=(Select-String -Path settings-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $uiVersion=(Get-Content settings-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if($rootVersion -ne $settingsVersion -or $rootVersion -ne $uiVersion){throw 'Settings version mismatch'}
          node --check settings-tauri/ui/app.js
          if($LASTEXITCODE -ne 0){throw 'Settings JavaScript syntax failed'}
          cargo test --manifest-path settings-tauri/Cargo.toml --target x86_64-pc-windows-msvc
          if($LASTEXITCODE -ne 0){throw 'Tauri Settings tests failed'}
          cargo build --manifest-path settings-tauri/Cargo.toml --release --target x86_64-pc-windows-msvc
          if($LASTEXITCODE -ne 0){throw 'Tauri Settings build failed'}
      - name: Build Excel 2019 Ribbon Add-in (x86 and x64, VBA-free)
        shell: pwsh
        run: |
          dotnet build ribbon/ExcelDailyRibbon.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Ribbon build failed' }
          $packed=@(Get-ChildItem -Path ribbon/bin/Release -Recurse -File -Filter '*packed.xll')
          $x86=@($packed|Where-Object{$_.Name -notmatch '64'})
          $x64=@($packed|Where-Object{$_.Name -match '64'})
          if ($x86.Count -ne 1 -or $x64.Count -ne 1) {
            throw "Expected one packed Ribbon XLL per Excel bitness, found x86=$($x86.Count) x64=$($x64.Count)"
          }
      - name: Test workbook Shape contracts without installed Excel
        shell: pwsh
        run: |
          dotnet build tests/ribbon-contract-tests/RibbonContractTests.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Ribbon contract build failed' }
          & tests/ribbon-contract-tests/bin/Release/net48/RibbonContractTests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Ribbon contract tests failed' }
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/excel-daily.exe dist/
          Copy-Item settings-tauri/target/x86_64-pc-windows-msvc/release/excel-daily-settings.exe dist/
          Copy-Item settings.json dist/
          Copy-Item events.example.json dist/
          Copy-Item README.md dist/
          Copy-Item scripts/*.ps1 dist/
          $packed=@(Get-ChildItem -Path ribbon/bin/Release -Recurse -File -Filter '*packed.xll')
          Copy-Item ($packed|Where-Object{$_.Name -notmatch '64'}|Select-Object -First 1).FullName dist/ExcelDailyRibbon.xll
          Copy-Item ($packed|Where-Object{$_.Name -match '64'}|Select-Object -First 1).FullName dist/ExcelDailyRibbon64.xll
          $ribbonRevision=(git rev-parse HEAD:ribbon).Trim()
          if ($ribbonRevision -notmatch '^[a-f0-9]{40}$') { throw 'Invalid Ribbon source revision' }
          $ribbonManifest=@{revision=$ribbonRevision;files=@{}}
          foreach($name in @('ExcelDailyRibbon.xll','ExcelDailyRibbon64.xll')){
            $ribbonManifest.files[$name]=(Get-FileHash -Algorithm SHA256 (Join-Path dist $name)).Hash.ToLowerInvariant()
          }
          $ribbonManifest | ConvertTo-Json -Depth 4 | Set-Content -Path dist/ribbon-version.json -Encoding utf8
          Compress-Archive -Path dist/* -DestinationPath excel-daily-windows.zip -Force
          (Get-FileHash -Algorithm SHA256 dist/excel-daily.exe).Hash.ToLower() | Set-Content -Path excel-daily.exe.sha256 -Encoding ascii -NoNewline
          (Get-FileHash -Algorithm SHA256 excel-daily-windows.zip).Hash.ToLower() | Set-Content -Path excel-daily-windows.zip.sha256 -Encoding ascii -NoNewline
      - uses: actions/upload-artifact@v4
        with:
          name: excel-daily-windows
          path: excel-daily-windows.zip
      - name: Create versioned GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version=(Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid Cargo version' }
          $latest=git ls-remote origin refs/heads/main
          $head=($latest -split '\s+')[0]
          if ($head -ne "$env:GITHUB_SHA") { Write-Output "Superseded build, skipping release"; exit 0 }
          $tag="v$version"
          $existing=gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "Release $tag already exists; do not replace immutable published binary."
          } else {
            gh release create $tag dist/excel-daily.exe dist/excel-daily-settings.exe excel-daily.exe.sha256 excel-daily-windows.zip excel-daily-windows.zip.sha256 --target "$env:GITHUB_SHA" --title "Excel Daily $tag" --notes "Windows x64; SHA256-verified automatic updates."
          }
