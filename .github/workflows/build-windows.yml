name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'settings.json'
      - '.github/workflows/build-windows.yml'

concurrency:
  group: excel-daily-windows-main
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Validate Rust
        run: cargo check --target x86_64-pc-windows-msvc
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          foreach ($file in @('scripts/update_excel.ps1','scripts/check_update.ps1','scripts/apply_update.ps1')) {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Error; exit 1 }
          }
      - name: Build release with embedded icon
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/excel-daily.exe dist/
          Copy-Item settings.json dist/
          Copy-Item events.example.json dist/
          Copy-Item README.md dist/
          Copy-Item scripts/*.ps1 dist/
          Compress-Archive -Path dist/* -DestinationPath excel-daily-windows.zip -Force
          (Get-FileHash -Algorithm SHA256 dist/excel-daily.exe).Hash.ToLower() | Set-Content -Path excel-daily.exe.sha256 -Encoding ascii -NoNewline
      - uses: actions/upload-artifact@v4
        with:
          name: excel-daily-windows
          path: excel-daily-windows.zip
      - name: Create versioned GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version=(Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid Cargo version' }
          $latest=git ls-remote origin refs/heads/main
          $head=($latest -split '\\s+')[0]
          if ($head -ne "$env:GITHUB_SHA") { Write-Output "Superseded build, skipping release"; exit 0 }
          $tag="v$version"
          $existing=gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "Release $tag already exists; do not replace immutable published binary."
          } else {
            gh release create $tag dist/excel-daily.exe excel-daily.exe.sha256 excel-daily-windows.zip --target "$env:GITHUB_SHA" --title "Excel Daily $tag" --notes "Windows x64; SHA256-verified automatic updates."
          }
