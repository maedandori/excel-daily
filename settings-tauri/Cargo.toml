[package]
name = "excel-daily-settings"
version = "0.3.27"
edition = "2021"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.55"
url = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }
ico = "0.4"

[profile.release]
opt-level = "s"
lto = true
strip = true
